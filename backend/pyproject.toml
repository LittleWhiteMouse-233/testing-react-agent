[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "android-tv-test-agent"
version = "0.1.0"
description = "Android TV subjective testing agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "langchain-anthropic>=1.7.2,<2",
  "langchain-core>=1.6.10,<2",
  "langchain[mcp]==1.4.6",
  "fastmcp==4.1.1",
  "mcp==2.3.0",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.2.12,<1.3",
  "langgraph-checkpoint-sqlite>=2.0,<4",
  "pydantic-settings>=2.8,<3",
  "python-multipart>=0.0.20,<1",
  "python-frontmatter>=1.1,<2",
  "rfc3986>=2,<3",
  "sqlalchemy[asyncio]>=2.0.38,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pyright>=1.1.410,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = [".."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
