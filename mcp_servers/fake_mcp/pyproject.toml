[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scripted-local-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mcp==1.30.0", "pydantic>=2.11,<3"]

[project.scripts]
fake-mcp = "fake_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
