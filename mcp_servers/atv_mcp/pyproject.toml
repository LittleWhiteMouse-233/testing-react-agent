[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atv-local-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastmcp==4.1.1", "mcp==2.3.0", "anyio>=4.5", "pydantic>=2.12,<3", "PyYAML>=6,<7"]

[project.scripts]
atv-mcp = "atv_mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["atv_adb_ctrl"]
py-modules = ["atv_mcp_server"]
